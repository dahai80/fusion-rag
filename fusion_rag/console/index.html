<!doctype html>
<html lang="zh" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fusion-RAG Console</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  darkMode: "class",
  theme: { extend: { colors: { accent: { 500: "#6366f1", 600: "#4f46e5" } } } },
};
</script>
<style>
  body { font-family: ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif; }
</style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen">
<div class="max-w-5xl mx-auto p-6 space-y-6">

  <header class="flex items-center justify-between border-b border-zinc-800 pb-4">
    <div>
      <h1 class="text-xl font-semibold tracking-tight">Fusion-RAG <span class="text-zinc-500 font-normal">控制台</span></h1>
      <p id="version" class="text-xs text-zinc-500 mt-0.5">…</p>
    </div>
    <div class="flex items-center gap-3">
      <span id="health-pill" class="text-xs px-2.5 py-1 rounded-full bg-zinc-800 text-zinc-400">检查中…</span>
      <input id="api-key" type="password" placeholder="API Key（可选）"
             class="bg-zinc-900 border border-zinc-800 rounded-lg text-xs px-3 py-1.5 w-44 placeholder-zinc-600 focus:outline-none focus:border-indigo-500">
    </div>
  </header>

  <section class="grid md:grid-cols-3 gap-3">
    <div class="md:col-span-2 flex gap-2">
      <input id="new-kb-name" placeholder="新知识库名称"
             class="flex-1 bg-zinc-900 border border-zinc-800 rounded-xl px-3 py-2 text-sm placeholder-zinc-600 focus:outline-none focus:border-indigo-500">
      <button onclick="createKb()" class="bg-indigo-600 hover:bg-indigo-500 rounded-xl px-4 py-2 text-sm font-medium">建库</button>
    </div>
    <div id="kb-stat" class="flex items-center justify-end text-xs text-zinc-500"></div>
  </section>

  <section class="grid md:grid-cols-5 gap-4">
    <aside class="md:col-span-2 border border-zinc-800/80 rounded-2xl bg-zinc-900/40 overflow-hidden">
      <div class="px-4 py-2.5 text-xs font-medium text-zinc-400 border-b border-zinc-800 flex justify-between items-center">
        <span>知识库</span><button onclick="loadKbs()" class="text-indigo-400 hover:text-indigo-300">刷新</button>
      </div>
      <ul id="kb-list" class="divide-y divide-zinc-800/60 max-h-96 overflow-y-auto"></ul>
    </aside>

    <main class="md:col-span-3 space-y-4">
      <div id="detail" class="hidden border border-zinc-800/80 rounded-2xl bg-zinc-900/40 p-4 space-y-4">
        <div class="flex items-center justify-between">
          <h2 id="kb-title" class="text-sm font-semibold"></h2>
          <button onclick="deleteKb()" class="text-xs text-red-400/80 hover:text-red-300">删除此库</button>
        </div>

        <div class="border border-zinc-800/80 rounded-xl overflow-hidden">
          <div class="px-3 py-2 text-xs font-medium text-zinc-400 border-b border-zinc-800">文档</div>
          <div class="p-3 flex gap-2">
            <input id="doc-name" placeholder="文档名" class="w-32 bg-zinc-900 border border-zinc-800 rounded-lg px-2.5 py-1.5 text-xs placeholder-zinc-600 focus:outline-none focus:border-indigo-500">
            <input id="doc-content" placeholder="文本内容" class="flex-1 bg-zinc-900 border border-zinc-800 rounded-lg px-2.5 py-1.5 text-xs placeholder-zinc-600 focus:outline-none focus:border-indigo-500">
            <button onclick="ingestDoc()" class="bg-zinc-800 hover:bg-zinc-700 rounded-lg px-3 py-1.5 text-xs font-medium">入库</button>
          </div>
          <ul id="doc-list" class="divide-y divide-zinc-800/60 max-h-52 overflow-y-auto text-xs"></ul>
        </div>

        <div class="border border-zinc-800/80 rounded-xl overflow-hidden">
          <div class="px-3 py-2 text-xs font-medium text-zinc-400 border-b border-zinc-800">检索测试</div>
          <div class="p-3 flex gap-2">
            <input id="query" placeholder="输入查询…" onKeyDown="if(event.key==='Enter')search()"
                   class="flex-1 bg-zinc-900 border border-zinc-800 rounded-lg px-2.5 py-1.5 text-xs placeholder-zinc-600 focus:outline-none focus:border-indigo-500">
            <button onclick="search()" class="bg-indigo-600 hover:bg-indigo-500 rounded-lg px-3 py-1.5 text-xs font-medium">搜索</button>
          </div>
          <div id="results" class="px-3 pb-3 space-y-2 text-xs"></div>
        </div>
      </div>
      <div id="empty" class="border border-dashed border-zinc-800 rounded-2xl p-10 text-center text-xs text-zinc-600">选择左侧知识库，或新建一个</div>
    </main>
  </section>
</div>

<script>
const $ = (id) => document.getElementById(id);
let currentKb = null;

// Issue #109: API base is PAGE-relative, not origin-relative. Behind the
// gateway the page origin is :11432 and the pass-through proxy only sees
// /shell/fusion-rag/* — an origin-root API fetch would 404 there.
// Deriving the base from location.pathname makes every call resolve to
// <page-dir>/kb/..., which is /shell/fusion-rag/kb/... both behind the
// gateway AND direct (fusion-rag serves the /kb API under the subpath too).
const API_BASE = (() => {
  let p = location.pathname.replace(/index\.html$/, "");
  return p.endsWith("/") ? p : p + "/";
})();

const keyHeaders = () => {
  const k = $("api-key").value.trim();
  return k ? { "X-API-Key": k } : {};
};

async function api(path, opts = {}) {
  const resp = await fetch(API_BASE + path.replace(/^\//, ""), {
    ...opts,
    headers: { "Content-Type": "application/json", ...keyHeaders(), ...(opts.headers || {}) },
  });
  if (!resp.ok) {
    const body = await resp.json().catch(() => ({}));
    throw new Error(body.detail || `HTTP ${resp.status}`);
  }
  return resp.json();
}

function toast(msg, bad = false) {
  const el = document.createElement("div");
  el.textContent = msg;
  el.className = `fixed bottom-6 right-6 z-50 px-4 py-2.5 rounded-xl text-xs shadow-lg border ${
    bad ? "bg-red-950/90 border-red-800 text-red-200" : "bg-zinc-900 border-zinc-700 text-zinc-200"}`;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

async function loadHealth() {
  try {
    const h = await api("/health");
    $("version").textContent = `v${h.version} · llm_auth=${h.llm_auth}`;
    $("health-pill").textContent = "运行中";
    $("health-pill").className = "text-xs px-2.5 py-1 rounded-full bg-emerald-950 text-emerald-400 border border-emerald-900";
  } catch {
    $("health-pill").textContent = "不可达";
    $("health-pill").className = "text-xs px-2.5 py-1 rounded-full bg-red-950 text-red-400 border border-red-900";
  }
}

async function loadKbs() {
  try {
    const kbs = await api("/kb/bases");
    $("kb-stat").textContent = `共 ${kbs.length} 个知识库`;
    $("kb-list").innerHTML = "";
    kbs.forEach((kb) => {
      const li = document.createElement("li");
      const active = currentKb && currentKb.id === kb.id;
      li.className = `px-4 py-2.5 cursor-pointer text-sm flex justify-between items-center ${
        active ? "bg-indigo-950/60" : "hover:bg-zinc-800/50"}`;
      li.innerHTML = `<div><div class="font-medium">${kb.name}</div>
        <div class="text-[10px] text-zinc-500">${kb.id} · ${kb.embedding_model} · ${kb.file_count ?? 0} docs</div></div>
        <span class="text-[10px] text-zinc-600">${kb.chunk_strategy}</span>`;
      li.onclick = () => selectKb(kb);
      $("kb-list").appendChild(li);
    });
  } catch (e) {
    toast(`加载知识库失败: ${e.message}`, true);
  }
}

async function createKb() {
  const name = $("new-kb-name").value.trim();
  if (!name) return toast("请输入知识库名称", true);
  try {
    const kb = await api("/kb/bases", { method: "POST", body: JSON.stringify({ name }) });
    $("new-kb-name").value = "";
    toast(`已创建 ${kb.id || kb.name}`);
    currentKb = kb;
    await loadKbs();
    showDetail(kb);
  } catch (e) {
    toast(`建库失败: ${e.message}`, true);
  }
}

function selectKb(kb) {
  currentKb = kb;
  loadKbs();
  showDetail(kb);
}

function showDetail(kb) {
  $("empty").classList.add("hidden");
  $("detail").classList.remove("hidden");
  $("kb-title").textContent = `${kb.name} (${kb.id})`;
  loadDocs();
}

async function loadDocs() {
  try {
    const docs = await api(`/kb/bases/${currentKb.id}/documents`);
    $("doc-list").innerHTML = "";
    (Array.isArray(docs) ? docs : docs.documents || []).forEach((d) => {
      const li = document.createElement("li");
      li.className = "px-3 py-2 flex justify-between items-center hover:bg-zinc-800/40";
      li.innerHTML = `<div class="truncate"><span class="font-medium">${d.doc_name || d.name || d.id}</span>
        <span class="text-zinc-500 ml-2">${d.chunk_count ?? d.chunks ?? ""} chunks${d.status ? " · " + d.status : ""}</span></div>`;
      const del = document.createElement("button");
      del.textContent = "删除";
      del.className = "text-red-400/80 hover:text-red-300 shrink-0 ml-2";
      del.onclick = () => deleteDoc(d.doc_id || d.id);
      li.appendChild(del);
      $("doc-list").appendChild(li);
    });
    if (!$("doc-list").children.length) {
      $("doc-list").innerHTML = '<li class="px-3 py-3 text-zinc-600 text-center">暂无文档</li>';
    }
  } catch (e) {
    toast(`加载文档失败: ${e.message}`, true);
  }
}

async function ingestDoc() {
  const content = $("doc-content").value.trim();
  const docName = $("doc-name").value.trim() || `inline-${Date.now()}.txt`;
  if (!content) return toast("请输入文档内容", true);
  try {
    const r = await api(`/kb/bases/${currentKb.id}/documents/ingest`, {
      method: "POST",
      body: JSON.stringify({ content_type: "text", content, doc_name: docName }),
    });
    $("doc-content").value = "";
    toast(`已入库 ${r.chunks} chunks`);
    loadDocs();
  } catch (e) {
    toast(`入库失败: ${e.message}`, true);
  }
}

async function deleteDoc(docId) {
  try {
    await api(`/kb/bases/${currentKb.id}/documents/${docId}`, { method: "DELETE" });
    toast("已删除");
    loadDocs();
  } catch (e) {
    toast(`删除失败: ${e.message}`, true);
  }
}

async function deleteKb() {
  if (!confirm(`确认删除知识库 ${currentKb.name}？`)) return;
  try {
    await api(`/kb/bases/${currentKb.id}`, { method: "DELETE" });
    toast("知识库已删除");
    currentKb = null;
    $("detail").classList.add("hidden");
    $("empty").classList.remove("hidden");
    loadKbs();
  } catch (e) {
    toast(`删除失败: ${e.message}`, true);
  }
}

async function search() {
  const query = $("query").value.trim();
  if (!query || !currentKb) return;
  $("results").innerHTML = '<div class="text-zinc-500 py-2">搜索中…</div>';
  try {
    const rows = await api(`/kb/bases/${currentKb.id}/search`, {
      method: "POST",
      body: JSON.stringify({ query, top_k: 5 }),
    });
    $("results").innerHTML = "";
    (Array.isArray(rows) ? rows : rows.results || []).forEach((r) => {
      const div = document.createElement("div");
      div.className = "border border-zinc-800/60 rounded-lg p-2.5 hover:border-zinc-700";
      div.innerHTML = `<div class="flex justify-between mb-1">
        <span class="text-zinc-400">${r.doc_name || r.doc_id || r.chunk_id}</span>
        <span class="text-indigo-400 font-mono">${(r.score ?? 0).toFixed(4)}</span></div>
        <p class="text-zinc-300 leading-relaxed">${(r.text || r.snippet || "").slice(0, 400)}</p>`;
      $("results").appendChild(div);
    });
    if (!$("results").children.length) $("results").innerHTML = '<div class="text-zinc-600 py-2">无结果</div>';
  } catch (e) {
    $("results").innerHTML = "";
    toast(`搜索失败: ${e.message}`, true);
  }
}

const savedKey = localStorage.getItem("rag.console.key");
if (savedKey) $("api-key").value = savedKey;
$("api-key").addEventListener("change", () => localStorage.setItem("rag.console.key", $("api-key").value.trim()));

loadHealth();
loadKbs();
</script>
</body>
</html>
