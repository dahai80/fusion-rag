# PyPI publish via Trusted Publishing (OIDC) — issue: publish fusion-rag to PyPI.
#
# One-time setup (pypi.org, as the account owner):
#   1. Project name claim: https://pypi.org/account/register/ is not needed for
#      the name itself — the first trusted-publishing run claims "fusion-rag"
#      via a Pending Publisher entry:
#        pypi.org -> Manage -> Publishing -> Add a new pending publisher
#        PyPI project name: fusion-rag
#        Owner: dahai80  Repository: fusion-rag
#        Workflow name: pypi.yml  Environment: pypi
#   2. GitHub side: Settings -> Environments -> create "pypi" (no secrets
#      needed; protect with a required reviewer if desired).
#
# Release flow: push a tag v* (or run manually via workflow_dispatch).
# No API tokens involved — OIDC only.

name: PyPI publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Trusted Publishing requires the id-token permission.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
