name: CI

on:
    push:
        branches: [main]
        paths-ignore:
            - "**.md"
            - "docs/**"
    pull_request:
        branches: [main]
        paths-ignore:
            - "**.md"
            - "docs/**"

# Issue #154 (fusion#2 CI retrofit): one run per ref — a new push to the same
# branch cancels the superseded run instead of queueing behind it.
concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                python-version: ["3.12", "3.13"]
        steps:
            - uses: actions/checkout@v4
            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@v5
              with:
                  python-version: ${{ matrix.python-version }}
                  cache: pip
                  cache-dependency-path: pyproject.toml
            - name: Install fusion-core (private in-tree dependency)
              env:
                  FUSION_CORE_TOKEN: ${{ secrets.FUSION_CORE_TOKEN }}
              run: |
                  if [ -n "$FUSION_CORE_TOKEN" ]; then
                    pip install "git+https://x-access-token:${FUSION_CORE_TOKEN}@github.com/dahai80/fusion-core.git"
                  else
                    echo "::error::FUSION_CORE_TOKEN secret is not set — needed to clone private dahai80/fusion-core. See issue #43."
                    exit 1
                  fi
            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -e ".[test]"
            - name: Run tests
              run: pytest tests/ -q

    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
                  cache: pip
                  cache-dependency-path: pyproject.toml
            - name: Install fusion-core (private in-tree dependency)
              env:
                  FUSION_CORE_TOKEN: ${{ secrets.FUSION_CORE_TOKEN }}
              run: |
                  if [ -n "$FUSION_CORE_TOKEN" ]; then
                    pip install "git+https://x-access-token:${FUSION_CORE_TOKEN}@github.com/dahai80/fusion-core.git"
                  else
                    echo "::error::FUSION_CORE_TOKEN secret is not set — needed to clone private dahai80/fusion-core. See issue #43."
                    exit 1
                  fi
            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -e ".[test]"
                  pip install ruff
            - name: Ruff check
              run: ruff check .
