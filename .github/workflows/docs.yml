name: docs

on:
  push:
    branches: [master, main]
    paths:
      - "**.md"
      - "ci/validate_docs.py"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "**.md"
      - "ci/validate_docs.py"
      - ".github/workflows/docs.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docs contract
        run: |
          python3 ci/validate_docs.py \
            --root . \
            --product fusion-rag \
            --class platform \
            --entry service \
            --skip-dirs ".git,.venv,.pytest_cache,.ruff_cache,.remember,.claude,fusion_rag.egg-info,logs,web/vendor,node_modules"
