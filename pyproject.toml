# callers: pip install -e .[test]; CI pipeline
# API: package dependencies including BM25 + jieba Chinese tokenization
# schema: standard pip dependency specifiers
# user instruction: "按照你的方案和计划落地所有phase阶段的需求"
[project]
name = "fusion-rag"
version = "0.3.0"
description = "Fusion-RAG — Apple Silicon native offline vector knowledge base backend"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.0.0",
    "lancedb>=0.10.0",
    "pyarrow>=15.0.0",
    "PyMuPDF>=1.24.0",
    "python-docx>=1.1.0",
    "markdownify>=0.12.0",
    "aiofiles>=23.0.0",
    "jieba>=0.42.1",
    "rank_bm25>=0.2.2",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["fusion_rag"]
branch = true
relative_files = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.setuptools.packages.find]
include = ["fusion_rag*"]
