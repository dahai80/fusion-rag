[project]
name = "fusion-rag"
version = "0.8.40"
description = "Fusion-RAG — Apple Silicon native offline vector knowledge base backend"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "dahai80" }]
keywords = ["rag", "vector-database", "embeddings", "bm25", "hybrid-search", "apple-silicon", "mlx"]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "httpx>=0.27.0",
    "fusion-core>=0.12.1",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.0.0",
    "lancedb>=0.10.0",
    "pyarrow>=15.0.0",
    "PyMuPDF>=1.24.0",
    "python-docx>=1.1.0",
    "python-pptx>=1.0.0",
    "openpyxl>=3.1.0",
    "ebooklib>=0.18",
    "markdownify>=0.12.0",
    "aiofiles>=23.0.0",
    "jieba>=0.42.1",
    "rank_bm25>=0.2.2",
    "pathspec>=0.12.0",
    "setproctitle>=1.3.0",
]

[project.urls]
Homepage = "https://github.com/dahai80/fusion-rag"
Repository = "https://github.com/dahai80/fusion-rag"
Issues = "https://github.com/dahai80/fusion-rag/issues"
Changelog = "https://github.com/dahai80/fusion-rag/releases"

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
]
# Optional: fusion-store HNSW vector backend (in-tree PyO3, NOT on PyPI).
# Install via the monorepo venv: pip install -e ../fusion-store (maturin).
# Enables FUSION_RAG_STORE_BACKEND=fusion-store. numpy ships with lancedb/pyarrow.
fusion_store = [
    "numpy>=1.26.0",
]
# Optional: Qdrant vector backend (per-tenant collection isolation, issue #66).
# Install via: pip install 'fusion-rag[qdrant]'. Enables FUSION_RAG_STORE_BACKEND=qdrant.
qdrant = [
    "qdrant-client>=1.10.0",
]
# Optional: layout-aware PDF ingestion (issue #131). Install via:
# pip install 'fusion-rag[docling]'. Enables FUSION_RAG_PDF_BACKEND=docling
# (tables + reading order); any failure falls back to the legacy PyMuPDF path.
docling = [
    "docling>=2.15.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["fusion_rag"]
branch = true
relative_files = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "S", "SIM", "C4", "RUF", "UP"]
ignore = ["BLE001", "S101", "S311", "S324", "S608", "RUF003", "RUF005", "E402", "UP042", "SIM108"]

[tool.setuptools.packages.find]
include = ["fusion_rag*"]

[tool.setuptools.package-data]
# Console UI page (issue: admin menu) must ship inside the wheel/editable install.
"fusion_rag.console" = ["*.html", "assets/*"]
