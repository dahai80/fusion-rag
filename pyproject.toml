[project]
name = "fusion-rag"
version = "0.8.0rc2"
description = "Fusion-RAG — Apple Silicon native offline vector knowledge base backend"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "fusion-core",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.0.0",
    "lancedb>=0.10.0",
    "pyarrow>=15.0.0",
    "PyMuPDF>=1.24.0",
    "python-docx>=1.1.0",
    "markdownify>=0.12.0",
    "aiofiles>=23.0.0",
    "jieba>=0.42.1",
    "rank_bm25>=0.2.2",
    "pathspec>=0.12.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
]
# Optional: fusion-store HNSW vector backend (in-tree PyO3, NOT on PyPI).
# Install via the monorepo venv: pip install -e ../fusion-store (maturin).
# Enables FUSION_RAG_STORE_BACKEND=fusion-store. numpy ships with lancedb/pyarrow.
fusion_store = [
    "numpy>=1.26.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["fusion_rag"]
branch = true
relative_files = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "S", "SIM", "C4", "RUF", "UP"]
ignore = ["BLE001", "S101", "S311", "S324", "S608", "RUF003", "RUF005", "E402", "UP042", "SIM108"]

[tool.setuptools.packages.find]
include = ["fusion_rag*"]
